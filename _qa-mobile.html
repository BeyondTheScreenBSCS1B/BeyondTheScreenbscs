<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; background: #fff; }
  iframe { border: 0; width: 390px; height: 9000px; display: block; }
</style>
</head>
<body>
<iframe id="f" src="_qa-desktop.html"></iframe>
<script>
  addEventListener('load', () => {
    const at = new URLSearchParams(location.search).get('at');
    if (!at) return;
    const win = document.getElementById('f').contentWindow;
    const doc = win.document;
    const el = doc.getElementById(at);
    if (!el) return;
    const y = el.getBoundingClientRect().top + win.scrollY - 90;
    doc.documentElement.style.transform = 'translateY(' + (-y) + 'px)';
    doc.documentElement.style.overflow = 'hidden';
  });
</script>
</body>
</html>
